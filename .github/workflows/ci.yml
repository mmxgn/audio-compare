name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  # Keep the supply-chain pins from eroding: every action by full commit SHA,
  # every container by digest, and no mutable download refs in the release.
  workflow-pins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          set -u
          fail=0
          if grep -nE '^\s*(- )?uses: ' .github/workflows/*.yml | grep -vE '@[0-9a-f]{40}( |$)'; then
            echo "::error::actions must be pinned to a full commit SHA"; fail=1
          fi
          if grep -nE '^\s*container:' .github/workflows/*.yml | grep -v '@sha256:'; then
            echo "::error::containers must be pinned by digest"; fail=1
          fi
          if grep -nE 'continuous|/master/|/main/' .github/workflows/package.yml; then
            echo "::error::release downloads must use immutable references"; fail=1
          fi
          exit $fail

  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.x"
      - run: pip install pre-commit
      - run: pre-commit run --all-files

  fedora:
    runs-on: ubuntu-latest
    container: fedora:45@sha256:a7d72ba2745b100a3351087472e5ee7b2450af7cf331e7673007e3817612839c
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          dnf install -y meson ninja-build gcc pkgconfig \
            gtk4-devel libadwaita-devel \
            gstreamer1-devel gstreamer1-plugins-base-devel libebur128-devel
      - run: meson setup build && ninja -C build

  ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build gcc pkg-config \
            libgtk-4-dev libadwaita-1-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libebur128-dev
      - run: meson setup build && ninja -C build

  macos:
    runs-on: macos-15
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install deps
        run: brew install meson ninja pkg-config gtk4 libadwaita gstreamer libebur128 librsvg
      - run: meson setup build && ninja -C build
      # Also proves the .app is self-contained: make-app.py fails if any
      # bundled binary still references /opt/homebrew.
      - name: Build .app and .dmg
        run: packaging/macos/make-app.py --dmg
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: audio-compare-macos-dmg
          path: dist/*.dmg
          retention-days: 14

  nix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
      - run: nix build -L
