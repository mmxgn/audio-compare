name: Package

on:
  push:
    tags:
      - 'v*'

# Build jobs get a read-only token. Only `publish`, which runs no build tooling
# and no third-party action, can write to releases.
permissions:
  contents: read

jobs:
  appimage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build gcc pkg-config \
            libgtk-4-dev libadwaita-1-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libebur128-dev \
            gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly

      - name: Build and install into AppDir
        run: |
          meson setup build --prefix=/usr
          ninja -C build
          DESTDIR="$PWD/AppDir" ninja -C build install

      # Pinned references plus a committed SHA-256, checked before anything is
      # made executable. See packaging/appimage/README.md to update.
      - name: Fetch pinned packaging tools
        run: |
          set -euo pipefail
          . packaging/appimage/tools.env
          fetch() { curl --fail --silent --show-error --location --proto '=https' --output "$1" "$2"; }
          fetch linuxdeploy-x86_64.AppImage \
            "https://github.com/linuxdeploy/linuxdeploy/releases/download/${LINUXDEPLOY_TAG}/linuxdeploy-x86_64.AppImage"
          fetch linuxdeploy-plugin-gtk.sh \
            "https://raw.githubusercontent.com/linuxdeploy/linuxdeploy-plugin-gtk/${PLUGIN_GTK_COMMIT}/linuxdeploy-plugin-gtk.sh"
          fetch linuxdeploy-plugin-gstreamer.sh \
            "https://raw.githubusercontent.com/linuxdeploy/linuxdeploy-plugin-gstreamer/${PLUGIN_GSTREAMER_COMMIT}/linuxdeploy-plugin-gstreamer.sh"
          sha256sum --check --strict packaging/appimage/tools.sha256
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-gtk.sh linuxdeploy-plugin-gstreamer.sh

      - name: Build AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          DEPLOY_GTK_VERSION: "4"
          OUTPUT: audio-compare-${{ github.ref_name }}-x86_64.AppImage
        run: |
          ./linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --desktop-file AppDir/usr/share/applications/org.mmxgn.audiocompare.desktop \
            --icon-file AppDir/usr/share/icons/hicolor/scalable/apps/org.mmxgn.audiocompare.svg \
            --plugin gtk \
            --plugin gstreamer \
            --output appimage

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: appimage
          path: audio-compare-*.AppImage
          if-no-files-found: error

  deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential debhelper meson ninja-build \
            libgtk-4-dev libadwaita-1-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libebur128-dev

      - name: Build .deb
        run: |
          cp -r packaging/debian debian
          dpkg-buildpackage -b -us -uc
          cp ../audio-compare_*.deb .

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deb
          path: "*.deb"
          if-no-files-found: error

  rpm:
    runs-on: ubuntu-latest
    # The tag is documentation; the digest is what runs.
    container: fedora:45@sha256:a7d72ba2745b100a3351087472e5ee7b2450af7cf331e7673007e3817612839c
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install deps
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            meson ninja-build gcc rpm-build pkgconfig \
            gtk4-devel libadwaita-devel \
            gstreamer1-devel gstreamer1-plugins-base-devel libebur128-devel

      - name: Build .rpm
        run: |
          VERSION=$(grep -oP "version\s*:\s*'\K[^']+" meson.build | head -1)
          mkdir -p ~/rpmbuild/{SOURCES,SPECS}
          tar czf ~/rpmbuild/SOURCES/audio-compare-${VERSION}.tar.gz \
            --transform "s,^\.,audio-compare-${VERSION}," \
            --exclude='.git' .
          cp packaging/audio-compare.spec ~/rpmbuild/SPECS/
          rpmbuild -bb ~/rpmbuild/SPECS/audio-compare.spec
          find ~/rpmbuild/RPMS -name '*.rpm' -exec cp {} . \;

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rpm
          path: "*.rpm"
          if-no-files-found: error

  dmg:
    runs-on: macos-15
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install deps
        run: brew install meson ninja pkg-config gtk4 libadwaita gstreamer libebur128 librsvg

      - name: Build .app and .dmg
        run: packaging/macos/make-app.py --dmg

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dmg
          path: dist/*.dmg
          if-no-files-found: error

  # The only job with a write token. It runs no build tooling: it collects the
  # packages, checksums them and creates the release with the runner's gh CLI.
  # needs: makes the release all-or-nothing.
  publish:
    needs: [appimage, deb, rpm, dmg]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: cd dist && sha256sum -- * > SHA256SUMS && cat SHA256SUMS

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
